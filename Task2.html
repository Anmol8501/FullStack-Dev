<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f6f8; color: #182333; font-family: Arial, sans-serif; }
        header { background: white; }
        .top { height: 70px; display: flex; align-items: center; gap: 30px; max-width: 1100px; margin: auto; padding: 10px 20px; }
        .logo { color: #86176d; font-size: 28px; font-weight: bold; }
        .search { flex: 1; display: flex; height: 38px; border: 1px solid #ddd; border-radius: 22px; overflow: hidden; }
        .search input { flex: 1; border: 0; padding: 0 15px; outline: none; }
        .search button { width: 55px; border: 0; background: #86176d; color: white; font-size: 18px; }
        .links { display: flex; align-items: center; gap: 15px; }
        .links button { border: 0; background: none; font-size: 14px; }
        .signin { background: #86176d !important; color: white; border-radius: 20px; padding: 10px 18px; }
        .categories { border-top: 1px solid #eee; border-bottom: 1px solid #eee; display: flex; justify-content: center; gap: 28px; padding: 14px; white-space: nowrap; overflow-x: auto; }
        .categories button { border: 0; background: white; color: #606975; font-weight: bold; }
        .categories button:hover { color: #86176d; }
        .products { max-width: 1100px; margin: 35px auto; padding: 0 20px; }
        .heading { display: flex; justify-content: space-between; align-items: center; }
        .heading h2 { margin-bottom: 4px; }
        .heading p { color: #747c86; font-size: 13px; margin-top: 0; }
        .view { border: 1px solid #aaa; border-radius: 20px; background: white; padding: 8px 17px; }
        .product-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px #ddd; }
        .picture { height: 245px; background-size: cover; background-position: center; position: relative; }
        .offer { position: absolute; left: 7px; top: 8px; background: #f13572; color: white; padding: 5px; font-size: 11px; font-weight: bold; }
        .heart { position: absolute; right: 8px; top: 8px; background: white; border: 0; border-radius: 50%; width: 30px; height: 30px; color: #6d8293; font-size: 19px; }
        .info { padding: 12px; }
        .name { height: 32px; overflow: hidden; font-size: 13px; }
        .price { font-size: 16px; font-weight: bold; }
        .old { color: #999; font-size: 11px; text-decoration: line-through; margin-left: 6px; }
        .bottom { display: flex; justify-content: space-between; margin-top: 15px; color: #777; font-size: 11px; }
        .cod { border: 1px solid #ddd; padding: 4px; border-radius: 4px; }
        .whatsapp { position: fixed; right: 25px; bottom: 25px; padding: 14px; border-radius: 50%; color: white; background: #17c675; font-size: 20px; }
        @media (max-width: 800px) { .product-list { grid-template-columns: repeat(3, 1fr); } .top { gap: 15px; } .links .track { display: none; } }
        @media (max-width: 550px) { .top { flex-wrap: wrap; height: auto; } .search { order: 3; flex-basis: 100%; } .banner { margin: 15px; height: 230px; padding: 30px 22px; } .banner h1 { font-size: 30px; } .products { margin-top: 25px; padding: 0 12px; } .product-list { grid-template-columns: repeat(2, 1fr); gap: 10px; } .picture { height: 190px; } .heading h2 { font-size: 17px; } .heading p { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="top">
            <div class="logo">ShopKart</div>
            <form class="search" id="searchForm"><input id="search" placeholder="Search for products..." aria-label="Search"><button>⌕</button></form>
            <div class="links"><button class="track"> Track Order</button><button>Like</button><button>Cart <span id="cart">0</span></button><button class="signin">♙ Sign In</button></div>
        </div>
        <nav class="categories"><button>Kurti, Saree & Lehenga</button><button>Women Western</button><button>Lingerie</button><button>Men</button><button>Kids & Toys</button><button>Home & Kitchen</button><button>Beauty & Health</button><button>Jewellery</button><button>Bags & Footwear</button></nav>
    </header>
    <section class="products">
        <div class="heading"><div><h2>Trending & Recommended For You</h2><p>Curated collection based on your interests & new arrivals</p></div><button class="view" onclick="showAll()">View All</button></div>
        <div class="product-list" id="productList"></div>
    </section>
    <a class="whatsapp" href="#">◔</a>

</body>
</html>
