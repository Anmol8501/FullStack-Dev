<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavBar</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        ul{
            display: flex;
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        div{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(0, 0, 0);
            padding: 10px 16px;
        }
        li{
            margin-right: 20px;
            color: white;
        }
        nav{
            margin-left: 16px;
        }
    </style>
</head>
<body>
    <div>
        <img width="70" height="50" src="https://cdn.dribbble.com/userupload/43003850/file/still-c39eb0285a0af66f0696a6d4573a9810.png">
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
                <li>Services</li>
            </ul>
        </nav>
    </div>
</body>
</html>
