<!DOCTYPE html>
<html>
<head>
    <title>JS Quiz Arena</title>

    <style>
        body {
            font-family: Arial;
            background-color: #faefef;
            text-align: center;
            padding: 50px;
        }
        .quiz-box {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 50px;
            border-radius: 10px;
        }
        button {
            display: block;
            width: 100%;
            height: 40px;
            padding: 20px;
            margin: 10px 0;
            cursor: pointer;
            border: 1px solid #b0b0b0;
            background-color: white;
            border-radius: 5px;
        }
        button:hover {
            background-color: #c3fde2;
        }
        #score {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="quiz-box">

        <h1>JS Quiz Arena</h1>
        <p id="progress">Q 1/5</p>
        <h2 id="question">Question</h2>

        <button ></button>
        <button ></button>
        <button ></button>
        <button ></button>

        <p id="score">Score: 0</p>

    </div>

    <script>
        const questions = [
            {
                question: "Which language is used to make web pages interactive?",
                options: ["HTML", "CSS", "JavaScript", "SQL"],
                answer: 2
            },

            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: ["var", "int", "string", "define"],
                answer: 0
            },

            {
                question: "Which symbol is used for comments in JavaScript?",
                options: ["//", "##", "<!--", "**"],
                answer: 0
            },

            {
                question: "Which method is used to print something in the console?",
                options: ["print()", "console.log()", "display()", "show()"],
                answer: 1
            },

            {
                question: "Which data type stores true or false?",
                options: ["String", "Number", "Boolean", "Array"],
                answer: 2
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        function showQuestion() {

            let q = questions[currentQuestion];

            document.getElementById("question").innerText = q.question;

            document.getElementById("option0").innerText = q.options[0];
            document.getElementById("option1").innerText = q.options[1];
            document.getElementById("option2").innerText = q.options[2];
            document.getElementById("option3").innerText = q.options[3];

            document.getElementById("progress").innerText =
                "Q " + (currentQuestion + 1) + "/" + questions.length;

            document.getElementById("score").innerText =
                "Score: " + score;
        }

        function checkAnswer(selectedOption) {

            if (selectedOption === questions[currentQuestion].answer) {
                score++;
                alert("Correct!");
            } else {
                alert("Wrong!");
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                document.getElementById("question").innerText =
                    "Quiz Finished!";

                document.getElementById("progress").innerText =
                    "Completed";

                document.getElementById("score").innerText =
                    "Final Score: " + score + "/" + questions.length;

                document.getElementById("option0").style.display = "none";
                document.getElementById("option1").style.display = "none";
                document.getElementById("option2").style.display = "none";
                document.getElementById("option3").style.display = "none";
            }
        }

        showQuestion();

    </script>

</body>
</html>
