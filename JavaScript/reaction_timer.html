<!DOCTYPE html>
<html>
<head>
    <title>Reaction Timer</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;
            background-color: red;

            text-align: center;
        }

        #box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <div id="box">

        <h1>Reaction Timer</h1>

        <p id="message">
            Click Start and wait for green!
        </p>

        <button id="startButton">
            Start
        </button>

        <h2>
            Reaction Time:
            <span id="result">-</span>
        </h2>

        <h3>
            Best Time:
            <span id="best">-</span>
        </h3>

    </div>


    <script>

        let startButton = document.getElementById("startButton");
        let message = document.getElementById("message");
        let result = document.getElementById("result");
        let best = document.getElementById("best");

        let timer;
        let startTime;
        let gameStarted = false;

        let bestTime = localStorage.getItem("bestTime");

        if (bestTime != null) {
            best.innerText = bestTime + " ms";
        }
        startButton.addEventListener("click", function () {
            clearTimeout(timer);

            document.body.style.backgroundColor = "red";
            message.innerText = "Wait for green...";
            result.innerText = "-";
            gameStarted = false;
            let delay = Math.floor(Math.random() * 3000) + 2000;

            timer = setTimeout(function () {
                document.body.style.backgroundColor = "green";
                message.innerText = "CLICK NOW!";
                startTime = Date.now();
                gameStarted = true;
            }, delay);
        });

        document.body.addEventListener("click", function (event) {
            if (event.target === startButton) {
                return;
            }

            if (gameStarted === false) {
                message.innerText = "Too early!";
                clearTimeout(timer);
                return;
            }
            let endTime = Date.now();
            let reactionTime = endTime - startTime;

            result.innerText = reactionTime + " ms";
            message.innerText = "Good job! Click Start to try again.";
            document.body.style.backgroundColor = "red";
            gameStarted = false;

            if (bestTime == null || reactionTime < Number(bestTime)) {
                bestTime = reactionTime;
                localStorage.setItem("bestTime", bestTime);
                best.innerText = bestTime + " ms";
            }
        });

    </script>

</body>
</html>
