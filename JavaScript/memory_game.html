<!DOCTYPE html>
<html>
<head>
    <title>Memory Card Match</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fcc2ec;
        }

        #game {
            width: 400px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            height: 90px;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            border-radius: 8px;
        }

        .open {
            background-color: lightblue;
            color: black;
        }
    </style>
</head>

<body>
    <h1>Memory Card Match</h1>
    <p>Find all the matching pairs!</p>
    <div id="game"></div>

    <script src="memory_game.js"></script>
</body>
</html>
