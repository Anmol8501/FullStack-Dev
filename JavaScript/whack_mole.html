<!DOCTYPE html>
<html>
<head>
    <title>Whack a Mole</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #game {
            width: 300px;
            margin: 20px auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .cell {
            height: 90px;
            background-color: lightgray;
            border: 2px solid black;
            cursor: pointer;
        }

        .mole {
            background-color: rgb(110, 232, 104);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Whack-a-Mole</h1>
    <h2>Score: <span id="score">0</span></h2>
    <h3>Time: <span id="time">30</span></h3>
    <button id="start">Start Game</button>
    <div id="game"></div>

        <script src="whack_mole.js"></script>

</body>
</html>
