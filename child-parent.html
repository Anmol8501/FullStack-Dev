<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: #ff6347;
            color: #fff;
            cursor: pointer;
        }
        button:active{
            background-color: #0800ff;
            color: #fff;
        }
        button{
            width:110px;
            height: 50px;
        }
        ul{
            list-style-type: none;
        }
        li{
            padding: 10px;
            width: 150px;
        }
        li:nth-child(2n-1){
            background-color: #ff6347;
            color: #fff;
        }
    </style>
</head>
<body>
    <button>Hey! Click Me</button>
    <a href="#">This is a link</a>
    <input type="checkbox"/>
    <ul>
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
        <li>List Item 4</li>
        <li>List Item 5</li>
        <li>List Item 6</li>
    </ul>
</body>
</html>
