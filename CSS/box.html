<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container</title>
    <style>
    *{
        margin: 0;
        padding: 0;
    }
    .container{
        display: flex;
        flex-direction: column;
        margin: 10px;
    }
    .box{
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
    }
    .box1{
        background-color: rgb(198, 79, 79);
        position: relative;
    }
    .box2{
        background-color: rgb(82, 82, 220);
        position: relative;
    }
    .box3{
        background-color: rgb(102, 163, 102);
        position: relative;
    }
    .box4{
        background-color: rgb(173, 173, 75);
    }
    .box5{
        background-color: rgb(239, 187, 90);
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
    </div>
</body>
</html>
