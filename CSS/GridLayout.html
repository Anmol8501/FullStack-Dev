<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body{
            background-color: rgb(161, 184, 228);
        }
        .container{
            background-color: blue;
            width: 80vw;
            height: 80vh;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .box{
            background-color:white;
            width: 100%;
        }
        .span2{ grid-column: 1 / 4; grid-row: 1 / 3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box span2"></div>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
