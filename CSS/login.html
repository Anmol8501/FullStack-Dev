<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(185, 195, 204);
        }

        .container {
            background-color: aliceblue;
            width: 300px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .login {
            display: flex;
            flex-direction: column;
            height: 300px;
        }

        .login h2 {
            text-align: center;
            margin-bottom: 25px;
            font-family: Arial, sans-serif;
        }


        input {
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="login">
            <h2>Login</h2>
            <p>Username</p>
            <input type="text" placeholder="Enter username">
            <p>Password</p>
            <input type="password" placeholder="Enter password">
            <button>Login</button>
        </div>
    </div>
</body>
</html>
